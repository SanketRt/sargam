[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sargam"
version = "0.1.0"
description = "Personal memoir engine: chat in, chronologically ordered book out."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# The hosted server. The local tool runs on the standard library.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.2",
    "authlib>=1.3",
]

[project.scripts]
sargam = "sargam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sargam = ["schema.sql"]
